[package]
name = "outlayer-cri-oracle"
version = "0.2.0"
description = "OutLayer Intel TDX worker for Paron v2: outlier-clipped CRI-H100 TWAP oracle and inference SLA verifier with Ed25519 attestations."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "outlayer_cri_oracle"
path = "src/lib.rs"

[[bin]]
name = "outlayer-cri-oracle"
path = "src/main.rs"

[dependencies]
ed25519-dalek = "2.1"
sha2 = "0.10"
hex = "0.4"
bs58 = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# OutLayer SDK (wasm32-wasip2 only): enclave-derived signing keys via `outlayer::signing_keys`.
outlayer = { version = "0.2.1", features = ["signing-keys"], optional = true }

[features]
default = []
# Build for the OutLayer Intel TDX enclave:
#   cargo build --target wasm32-wasip2 --release --features outlayer-tee
outlayer-tee = ["dep:outlayer"]
