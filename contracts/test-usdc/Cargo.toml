[package]
name = "test-usdc"
version = "0.2.0"
description = "Testnet-only NEP-141 USDC stand-in (6 decimals) with a capped faucet, used to fund Paron v2 margin on NEAR testnet. No value."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30"
near-contract-standards = "5.30"

[dev-dependencies]
near-sdk = { version = "5.30", features = ["unit-testing"] }
