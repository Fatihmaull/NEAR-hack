[package]
name = "paron-core"
version = "0.2.0"
description = "Paron v2 core contract: NEP-245 compute forwards, 25%/15% margin vaults, CLOB, agent guardrails and OutLayer TEE settlement on NEAR."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30"
hex = "0.4"

[dev-dependencies]
near-sdk = { version = "5.30", features = ["unit-testing"] }
ed25519-dalek = "2.1"
# End-to-end tests: the contract verifies attestations produced by the real OutLayer worker crate.
outlayer-cri-oracle = { path = "../../tee-worker/outlayer-cri-oracle" }
